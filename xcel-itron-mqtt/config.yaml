name: "Xcel iTron MQTT (2)"
description: "Bridge from Xcel iTron smart meters to MQTT — second-meter instance (stock zaknye + pending DEVICE_NAME patch)"
url: "https://www.github.com/austindotzip/hassio-xcel-itron-mqtt"
version: "2.0.0"
slug: "xcel-itron-mqtt2"
arch:
  - aarch64
  - amd64
init: false
services:
  - mqtt:need
panel_icon: mdi:meter-electric-outline
map:
  - addon_config:rw
options:
  meter_ip:
  meter_port: 8081
  cert_dir: /config/certs
  cert_file: cert.pem
  key_file: key.pem
  # Required for this second-meter instance: a distinct name is what keeps its
  # unique_ids and MQTT topics from colliding with the primary meter's.
  device_name: "Xcel Itron 5 Floor 2"
  loglevel: INFO
  mqtt: {}
schema:
  meter_ip: str
  meter_port: port
  lfdi: str?
  # legacy key kept so pre-2.0 stored configs validate; init migrates it to lfdi
  ldfi: str?
  cert_dir: str?
  cert_file: str?
  key_file: str?
  device_name: str
  loglevel: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)?
  mqtt:
    server: str?
    port: port?
    user: str?
    password: password?
    topic_prefix: str?
